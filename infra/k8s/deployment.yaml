apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-engine-worker
  labels:
    app.kubernetes.io/name: telemetry-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-engine
  template:
    metadata:
      labels:
        app: telemetry-engine
    spec:
      containers:
        - name: processor
          image: telemetry-kinematics-engine:v0.5.0
          command: ["./scripts/run_tests.sh"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: LOG_LEVEL
              value: "INFO"
