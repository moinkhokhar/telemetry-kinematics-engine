apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-engine-worker
  labels:
    app.kubernetes.io/name: telemetry-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-engine
  template:
    metadata:
      labels:
        app: telemetry-engine
    spec:
      containers:
        - name: processor
          image: telemetry-kinematics-engine:v0.7.1
          command: ["python", "-m", "src"]
          ports:
            - containerPort: 50051
              name: telemetry
              protocol: UDP
            - containerPort: 8080
              name: health
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: TELEMETRY_PORT
              value: "50051"
            - name: HEALTH_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
