apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-engine-worker
  labels:
    app.kubernetes.io/name: telemetry-engine
    app.kubernetes.io/component: stream-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-engine
  template:
    metadata:
      labels:
        app: telemetry-engine
    spec:
      containers:
        - name: telemetry-processor
          image: telemetry-kinematics-engine:v0.2.0
          command: ["pytest", "--cov=src", "--cov-fail-under=85"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: LOG_LEVEL
              value: "INFO"
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-engine-service
spec:
  selector:
    app: telemetry-engine
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
