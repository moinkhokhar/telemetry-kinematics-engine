name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic numpy scipy
      - name: Run Ruff Linter
        run: ruff check src tests
      - name: Run Mypy Strict Type Check
        run: mypy src

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Run Security Audit
        run: pip-audit -r requirements.txt

  test-matrix:
    name: Unit & Coverage Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-audit]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Execute Pytest with 85% Coverage Limit
        run: |
          pytest --cov=src --cov-report=xml --cov-fail-under=85
