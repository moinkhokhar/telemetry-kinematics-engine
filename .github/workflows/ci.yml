name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic numpy scipy
      - name: Run Ruff Linter
        run: ruff check src tests
      - name: Run Mypy Strict Type Check
        run: mypy src

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Poetry & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
      - name: Audit Environment Dependencies
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit

  infrastructure-check:
    name: Terraform Validation & Policy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest"
      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform fmt -check
      - name: Terraform Init (Backend-Free Validation)
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Terraform Validate
        run: terraform -chdir=infra/terraform validate
      - name: Run tfsec Security Policy Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          additional_args: --soft-fail

  test-matrix:
    name: Unit & Coverage Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-audit, infrastructure-check]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Poetry & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction
      - name: Execute Pytest with 85% Coverage Limit
        run: |
          pytest --cov=src --cov-report=xml --cov-fail-under=85
