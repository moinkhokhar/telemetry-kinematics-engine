[tool.poetry]
name = "telemetry-kinematics-engine"
version = "0.7.0"
description = "Production-grade aerospace telemetry decoder, geodetic projections, and 6-DOF state estimation engine"
authors = ["Moin Khokhar <moinkhokhar1998@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.4"
pydantic = "^2.8.2"
scipy = "^1.13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^5.0.0"
ruff = "^0.5.7"
mypy = "^1.11.1"
pip-audit = "^2.7.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
