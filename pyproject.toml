[project]
name = "telemetry-kinematics-engine"
version = "0.1.0"
description = "High-precision telemetry kinematics and state estimation engine"
authors = [{ name = "Author", email = "developer@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
